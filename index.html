<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Joke Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="joke-card">
            <h1>😂 Joke Generator</h1>
            <div id="joke-display" class="joke-display">
                <p id="joke-text">Click the button to get a random joke!</p>
            </div>
            <button id="get-joke-btn" class="btn">Get a Joke</button>
            <button id="copy-btn" class="btn btn-secondary">Copy Joke</button>
            <p id="loading" class="loading" style="display: none;">Loading joke...</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
